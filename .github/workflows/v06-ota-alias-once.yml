name: Add v0.6 OTA compatibility filename once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v06-ota-alias-once.yml']
permissions:
  contents: write
jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Add app-compatible firmware asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://github.com/valerio1694-netizen/SK120-Downloads/releases/download/v0.6.0/SK120-LAB-v0.6-OTA.bin' -o SK120-OTA-C3-firmware.bin
          test -s SK120-OTA-C3-firmware.bin
          gh release upload v0.6.0 SK120-OTA-C3-firmware.bin --repo 'valerio1694-netizen/SK120-Downloads'
