name: Publish SK120 build artifacts
on:
  workflow_dispatch:
    inputs:
      firmware_zip_url:
        description: Signed URL for firmware build ZIP
        required: true
        type: string
      android_zip_url:
        description: Signed URL for Android build ZIP
        required: true
        type: string
      release_tag:
        description: New release tag
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled artifacts
        env:
          FIRMWARE_ZIP: ${{ inputs.firmware_zip_url }}
          APP_ZIP: ${{ inputs.android_zip_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$FIRMWARE_ZIP" -o /tmp/firmware.zip
          curl --fail --location --retry 3 --silent --show-error "$APP_ZIP" -o /tmp/android.zip
          mkdir -p dist
          unzip -j /tmp/firmware.zip -d dist
          unzip -j /tmp/android.zip -d dist
          test -s dist/SK120-OTA-C3-factory.bin
          test -s dist/SK120-OTA-C3-firmware.bin
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/SK120-Control.apk
      - name: Create public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.bin dist/*.apk --repo "valerio1694-netizen/SK120-Downloads" --title "SK120 Control $RELEASE_TAG" --notes "Hardware build, test without load first."
