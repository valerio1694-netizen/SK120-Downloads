name: Publish SK120 LAB v0.8.7 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.8.7-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful CI artifacts
        env:
          APP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-ee84-81f4-8133-5e7489257382/raw?se=2026-11-02T23%3A22%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=90db6b98-3653-54e2-a369-7673cec1063d&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T05%3A27%3A33Z&ske=2026-11-03T05%3A27%3A33Z&sks=b&skv=2026-02-06&sig=FZGpBlvEHXDpkkkwgU36Smm6fUznXSbA63OpsyxU47s%3D'
          ESP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6350-81f4-857b-70afffd8a925/raw?se=2026-11-02T23%3A22%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=19df35bb-c8ba-5e44-8788-1f968c3e2d94&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T08%3A54%3A43Z&ske=2026-11-03T08%3A54%3A43Z&sks=b&skv=2026-02-06&sig=nRgcpGzWkxveWZ5zFFy%2BK0sulXaiYF42IB0fSuKqHEM%3D'
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fsSL --retry 3 "$APP_URL" -o /tmp/app.zip
          curl -fsSL --retry 3 "$ESP_URL" -o /tmp/esp.zip
          unzip -jp /tmp/app.zip app-debug.apk > output/SK120-LAB-v0.8.7.apk
          unzip -jp /tmp/esp.zip SK120-OTA-C3-firmware.bin > output/SK120-LAB-v0.8.7-OTA.bin
          test "$(stat -c%s output/SK120-LAB-v0.8.7.apk)" -eq 9769266
          test "$(stat -c%s output/SK120-LAB-v0.8.7-OTA.bin)" -eq 623728
          echo 'ca3420da1926b87e1bc13c3763593bc272f8cf714790f45b1ffca627d6d256de  output/SK120-LAB-v0.8.7.apk' | sha256sum -c
          echo '7ebfaa0b8199f432c4bfef7e2688793e76b39044f744349c27fd6addec459e11  output/SK120-LAB-v0.8.7-OTA.bin' | sha256sum -c
          cp output/SK120-LAB-v0.8.7-OTA.bin output/SK120-OTA-C3-firmware.bin
          sha256sum output/* > output/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.7 output/* --repo 'valerio1694-netizen/SK120-Downloads' --latest --title 'SK120 LAB v0.8.7' --notes 'Modbus register catalog and controlled FC06 writes for verified 0x5959 / firmware 142 / slave 1 / baud 6 SK120; pre/post register readback, output OFF and range restrictions, no undocumented or communication-changing writes. Read-only scanner supports baseline and change comparison to investigate unknown addresses through physical device controls. QR-code GitHub latest release link remains configured on ESP OLED; scan reliability needs physical confirmation. Android APK and ESP32-C3 OTA passed CI; hardware behaviors not yet verified.'
