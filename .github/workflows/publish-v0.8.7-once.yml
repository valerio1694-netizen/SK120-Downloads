name: Publish SK120 LAB v0.8.7 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.8.7-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify compiled release files
        env:
          APP_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-1ccc-8210-b827-dcf1948b727c/raw?se=2026-11-02T23%3A25%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=07099dea-3c08-52a7-847d-4bd24d135f86&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T06%3A24%3A48Z&ske=2026-11-03T06%3A24%3A48Z&sks=b&skv=2026-02-06&sig=CCaQuf34f3ES/eUZQCpcDstaorIj6MJQyt6SAvlY8W4%3D'
          ESP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9e1c-81f4-a926-22d37db2f63c/raw?se=2026-11-02T23%3A25%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=30442662-b2b1-51fe-b07c-a1992bb8fd1d&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T06%3A06%3A27Z&ske=2026-11-03T06%3A06%3A27Z&sks=b&skv=2026-02-06&sig=vM9XX/GYZOP7xmgMML2fnq8Z87xzh4d3/hV7Y323CSY%3D'
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fsSL --retry 3 "$APP_URL" -o /tmp/sk-app.zip
          curl -fsSL --retry 3 "$ESP_URL" -o /tmp/sk-esp.zip
          unzip -jp /tmp/sk-app.zip app-debug.apk > output/SK120-LAB-v0.8.7.apk
          unzip -jp /tmp/sk-esp.zip SK120-OTA-C3-firmware.bin > output/SK120-LAB-v0.8.7-OTA.bin
          test "$(stat -c%s output/SK120-LAB-v0.8.7.apk)" -eq 9769266
          test "$(stat -c%s output/SK120-LAB-v0.8.7-OTA.bin)" -eq 623776
          echo 'ae0362d100519236f152b18cea6f07b1b9cbd2e106eb952be9739c68d422cc7a  output/SK120-LAB-v0.8.7.apk' | sha256sum -c
          echo '472577ac33226799bfab811efcedd711ec48ef9e1c127f79b34b89096d6a22d9  output/SK120-LAB-v0.8.7-OTA.bin' | sha256sum -c
          cp output/SK120-LAB-v0.8.7-OTA.bin output/SK120-OTA-C3-firmware.bin
          sha256sum output/* > output/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.8.7 output/* --repo 'valerio1694-netizen/SK120-Downloads' --clobber
          gh release edit v0.8.7 --repo 'valerio1694-netizen/SK120-Downloads' --latest --notes 'SK120 LAB v0.8.7: fully rebuilt Modbus register editor and differential scanner; OTA image corrected with 0.1-degree Celsius scaling for OTP register 0x005C, signed image SHA256 472577ac33226799bfab811efcedd711ec48ef9e1c127f79b34b89096d6a22d9. Writes gated by exact model fingerprint, output off, explicit values and readback. Sensitive and unknown registers remain blocked. Hardware validation pending.'
