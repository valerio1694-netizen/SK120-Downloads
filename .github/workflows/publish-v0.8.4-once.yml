name: Publish SK120 LAB v0.8.4 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.8.4-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read successful validated CI artifacts
        env:
          APP_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-ada0-8211-8507-be7e5faab3eb/raw?se=2026-11-02T17%3A59%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=64f7812b-4d8b-5db8-aabd-4f0bff274694&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T05%3A58%3A46Z&ske=2026-11-03T05%3A58%3A46Z&sks=b&skv=2026-02-06&sig=/Lmurd/Ql8emG5VRZaGZcaqvTpfTGM0OumTMHO0aReo%3D'
          FIRMWARE_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-cfe4-820a-baf3-a45db05f5ec4/raw?se=2026-11-02T17%3A59%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=67ddd39b-92ef-5886-936c-7737a26d31c1&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T03%3A33%3A51Z&ske=2026-11-03T03%3A33%3A51Z&sks=b&skv=2026-02-06&sig=RBiazIKQWYr95zivfuF5dScCo/y7QE2RBMU40AOTzOw%3D'
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fsSL --retry 3 "$APP_URL" -o /tmp/app.zip
          curl -fsSL --retry 3 "$FIRMWARE_URL" -o /tmp/esp.zip
          unzip -jp /tmp/app.zip app-debug.apk > output/SK120-LAB-v0.8.4.apk
          unzip -jp /tmp/esp.zip SK120-OTA-C3-firmware.bin > output/SK120-LAB-v0.8.4-OTA.bin
          unzip -jp /tmp/esp.zip SK120-OTA-C3-factory.bin > output/SK120-LAB-v0.8.4-factory.bin
          test "$(stat -c%s output/SK120-LAB-v0.8.4.apk)" -eq 9703726
          test "$(stat -c%s output/SK120-LAB-v0.8.4-OTA.bin)" -eq 621376
          echo '08e5239a40869cab7cb9831dd4cb60605b29d09594fbf1dadb3700a4bdd7481c  output/SK120-LAB-v0.8.4.apk' | sha256sum -c
          echo 'b1eec555d463c91afaddfb3352315b005c49200c82daa10044a1b14ef15182b0  output/SK120-LAB-v0.8.4-OTA.bin' | sha256sum -c
          cp output/SK120-LAB-v0.8.4-OTA.bin output/SK120-OTA-C3-firmware.bin
          sha256sum output/* > output/SHA256SUMS.txt
      - name: Publish GitHub downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.4 output/* --repo 'valerio1694-netizen/SK120-Downloads' --latest --title 'SK120 LAB v0.8.4' --notes 'App: redesigned near-frontal 3D device model, smoother MPU roll/pitch display with ~320ms IIR and 0.16/0.32 degree zero hysteresis, updated monochrome 128x64 OLED level preview. Firmware: OLED IIR smoothing 0.20 per frame, 0.16/0.34-degree zero hysteresis and fixed Y-value alignment. BLE OTA and HUSB238 controls retained. Android and ESP32-C3 builds passed; new graphic behavior not yet hardware verified. Flash the OTA BIN, never the factory BIN for BLE OTA.'
